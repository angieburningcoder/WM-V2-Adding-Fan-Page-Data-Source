<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Watchmen V2 多來源社群偽冒偵測前端 Prototype" />
  <title>Watchmen V2｜社群媒體監測</title>
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="收合選單" aria-expanded="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.7 12 16 7.7l-1.4-1.4L8.9 12l5.7 5.7 1.4-1.4L11.7 12Zm-5 0L11 7.7 9.6 6.3 3.9 12l5.7 5.7L11 16.3 6.7 12Z"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav" aria-label="主選單">
        <a class="nav-item" href="#">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z"/></svg>
          </span>
          <span class="nav-text">儀表板</span>
        </a>

        <div class="nav-group">
          <div class="nav-item nav-item--group">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4Zm6 12h4v-4h-4v4Zm-6 0h4v-4H4v4Zm0-6h4v-4H4v4Zm6 0h4v-4h-4v4Zm6-10v4h4V4h-4Zm-6 4h4V4h-4v4Zm6 6h4v-4h-4v4Zm0 6h4v-4h-4v4Z"/></svg>
            </span>
            <span class="nav-text">白名單</span>
          </div>
          <a class="nav-sub" href="#"><span class="nav-text">電話號碼</span></a>
          <a class="nav-sub" href="#"><span class="nav-text">簡訊號碼</span></a>
          <a class="nav-sub" href="#"><span class="nav-text">社群媒體</span></a>
        </div>

        <div class="nav-group">
          <div class="nav-item nav-item--group">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M14 17H4v2h10v-2Zm6-8H4v2h16V9ZM4 15h16v-2H4v2ZM4 5v2h16V5H4Z"/></svg>
            </span>
            <span class="nav-text">監測清單</span>
          </div>
          <a class="nav-sub" href="#"><span class="nav-text">電話號碼</span></a>
          <a class="nav-sub" href="#"><span class="nav-text">簡訊號碼</span></a>
          <a class="nav-sub is-current" href="#" aria-current="page"><span class="nav-text">社群媒體</span></a>
        </div>

        <div class="nav-group">
          <div class="nav-item nav-item--group">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58ZM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2Z"/></svg>
            </span>
            <span class="nav-text">設定</span>
          </div>
          <a class="nav-sub" href="#"><span class="nav-text">修改密碼</span></a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button class="lang-selector" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-2.9a15.6 15.6 0 0 0-1.3-3.6A8 8 0 0 1 18.9 8ZM12 4.1c.7 1 1.3 2.3 1.7 3.9h-3.4c.4-1.6 1-2.9 1.7-3.9ZM4.3 14a8 8 0 0 1 0-4h3.3a17 17 0 0 0 0 4H4.3Zm.8 2H8a15.6 15.6 0 0 0 1.3 3.6A8 8 0 0 1 5.1 16Zm2.9-8H5.1a8 8 0 0 1 4.2-3.6A15.6 15.6 0 0 0 8 8Zm4 11.9c-.7-1-1.3-2.3-1.7-3.9h3.4c-.4 1.6-1 2.9-1.7 3.9ZM14.1 14H9.9a15 15 0 0 1 0-4h4.2a15 15 0 0 1 0 4Zm.6 5.6a15.6 15.6 0 0 0 1.3-3.6h2.9a8 8 0 0 1-4.2 3.6Zm1.7-5.6a17 17 0 0 0 0-4h3.3a8 8 0 0 1 0 4h-3.3Z"/></svg>
          <span class="nav-text">繁體中文 Chinese (TW)</span>
        </button>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Watchmen 首頁">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 28 28" role="img">
              <circle cx="14" cy="14" r="13" fill="#1b3a63" stroke="#fff" stroke-width="1.6"/>
              <path fill="#fff" d="M7.4 9.2h3.4l3.2 7.4 3.2-7.4h3.4l-5.2 11.2h-2.8L7.4 9.2Z"/>
            </svg>
          </span>
          <span class="brand-text">Watchmen</span>
        </a>

        <div class="topbar-actions">
          <button class="topbar-user" type="button" aria-label="目前使用者 Angela Lin">
            <svg class="user-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5Z"/></svg>
            <span>Angela Lin</span>
          </button>
          <button class="client-selector" type="button" aria-label="切換客戶">
            <span id="clientName">威秀</span>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 5.6 6.4 9.2 7.5 10.3 10 7.8l2.5 2.5 1.1-1.1L10 5.6Zm0 8.8 3.6-3.6-1.1-1.1L10 12.2 7.5 9.7l-1.1 1.1L10 14.4Z"/></svg>
          </button>
          <button class="icon-button icon-button--top" type="button" aria-label="登出">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3h8a2 2 0 0 1 2 2v4h-2V5h-8v14h8v-4h2v4a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2v-4h2v4Zm3.6 4.6L18 12l-4.4 4.4-1.4-1.4 2-2H4v-2h10.2l-2-2 1.4-1.4Z"/></svg>
          </button>
        </div>
      </header>

      <main class="content">
        <div class="content-inner">
          <h1 class="page-title">社群媒體監測</h1>

          <div class="section-heading">
            <h2>社群媒體總覽</h2>
            <button class="help-button" type="button" data-tooltip="整合 Fan Page 與 Meta Ads 兩種偵測來源，以粉絲頁為案件主體呈現。" aria-label="頁面說明">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/></svg>
            </button>
            <span class="prototype-badge">FE Prototype</span>
          </div>

          <section class="stats-row" aria-label="案件摘要">
            <article class="stat-card">
              <span class="stat-label">可疑粉絲頁</span>
              <strong id="statTotal">0</strong>
            </article>
            <article class="stat-card">
              <span class="stat-label">高風險</span>
              <strong id="statHigh" class="is-high">0</strong>
            </article>
            <article class="stat-card">
              <span class="stat-label">雙來源命中</span>
              <strong id="statBoth">0</strong>
            </article>
            <article class="stat-card">
              <span class="stat-label">關聯廣告</span>
              <strong id="statAds">0</strong>
            </article>
          </section>

          <section class="card table-card" aria-labelledby="case-list-title">
            <div class="table-card-header">
              <h2 id="case-list-title">可疑社群廣告清單</h2>
              <button id="exportButton" class="link-button" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3h2v10.2l3.6-3.6L18 11l-6 6-6-6 1.4-1.4 3.6 3.6V3ZM5 19h14v2H5v-2Z"/></svg>
                匯出報表
              </button>
            </div>

            <div class="toolbar">
              <label class="search-box search-box--wide" aria-label="搜尋社群廣告">
                <input id="tableSearch" type="search" placeholder="搜尋粉絲頁名稱／編號／廣告，可空白分隔多關鍵字" />
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 19.6-5.2-5.2a7 7 0 1 0-1.4 1.4l5.2 5.2 1.4-1.4ZM5 10.5a5.5 5.5 0 1 1 11 0 5.5 5.5 0 0 1-11 0Z"/></svg>
              </label>

              <div class="toolbar-filters">
                <div class="date-dropdown">
                  <button id="dateToggle" class="date-toggle" type="button" aria-expanded="false" aria-haspopup="true">
                    <svg class="date-toggle-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7Zm12 17H5V10h14v9Zm0-11H5V6h14v2Z"/></svg>
                    <span id="dateLabel">2026/08/15 - 2026/08/21</span>
                    <svg class="caret" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13 5.5 8.5 6.9 7.1 10 10.2l3.1-3.1 1.4 1.4L10 13Z"/></svg>
                  </button>
                  <div id="datePanel" class="date-panel" hidden>
                    <div class="date-panel-row">
                      <label class="outlined-field">
                        <span class="outlined-label">自</span>
                        <input id="dateFrom" type="date" value="2026-08-15" />
                      </label>
                      <label class="outlined-field">
                        <span class="outlined-label">到</span>
                        <input id="dateTo" type="date" value="2026-08-21" />
                      </label>
                    </div>
                    <div class="quick-range">
                      <span class="quick-range-label">快速搜尋：</span>
                      <button type="button" data-range="today">今日</button>
                      <button type="button" data-range="yesterday">昨日</button>
                      <button type="button" data-range="week">過去一週</button>
                      <button type="button" data-range="month">過去一個月</button>
                    </div>
                  </div>
                </div>

                <select id="sourceFilter" class="filter-select" aria-label="資料來源">
                  <option value="all">資料來源：全部</option>
                  <option value="fan-page">Fan Page</option>
                  <option value="meta-ads">Meta Ads</option>
                  <option value="both">雙來源命中</option>
                </select>

                <select id="riskFilter" class="filter-select" aria-label="偽冒風險程度">
                  <option value="all">偽冒風險：全部</option>
                  <option value="high">High</option>
                  <option value="medium">Medium</option>
                  <option value="low">Low</option>
                </select>

                <select id="statusFilter" class="filter-select" aria-label="處理狀態">
                  <option value="all">處理狀態：全部</option>
                  <option value="scheduled">已排程</option>
                  <option value="submitted">已送件</option>
                  <option value="accepted">已受理</option>
                  <option value="success">已下架成功</option>
                  <option value="takedown_confirmed">因其他因素被下架</option>
                  <option value="failed">下架失敗</option>
                  <option value="not_submitted">不送件</option>
                  <option value="false_positive">誤判</option>
                </select>

                <select id="platformFilter" class="filter-select" aria-label="投放平台">
                  <option value="all">投放平台：全部</option>
                  <option value="facebook">Facebook</option>
                  <option value="instagram">Instagram</option>
                  <option value="messenger">Messenger</option>
                  <option value="threads">Threads</option>
                  <option value="audience_network">Audience Network</option>
                </select>
              </div>
            </div>

            <div id="activeFilters" class="active-filters" hidden></div>

            <div class="table-scroll">
              <table class="data-table">
                <thead>
                  <tr>
                    <th scope="col" class="expand-column"><span class="sr-only">展開</span></th>
                    <th scope="col"><button class="th-sort" type="button" data-sort="name"><span>粉絲頁名稱</span><span class="sort-icon" aria-hidden="true"></span></button></th>
                    <th scope="col"><button class="th-sort" type="button" data-sort="risk"><span>偽冒風險程度</span><span class="sort-icon" aria-hidden="true"></span></button></th>
                    <th scope="col"><button class="th-sort" type="button" data-sort="ads"><span>廣告風險</span><span class="sort-icon" aria-hidden="true"></span></button></th>
                    <th scope="col"><button class="th-sort" type="button" data-sort="platforms"><span>投放平台</span><span class="sort-icon" aria-hidden="true"></span></button></th>
                    <th scope="col" class="number-column"><button class="th-sort" type="button" data-sort="followers"><span>粉絲頁追蹤者數</span><span class="sort-icon" aria-hidden="true"></span></button></th>
                    <th scope="col"><button class="th-sort" type="button" data-sort="sources"><span>資料來源</span><span class="sort-icon" aria-hidden="true"></span></button></th>
                    <th scope="col"><button class="th-sort" type="button" data-sort="status"><span>處理狀態</span><span class="sort-icon" aria-hidden="true"></span></button></th>
                    <th scope="col"><button class="th-sort" type="button" data-sort="lastDetected"><span>最後爬取時間</span><span class="sort-icon" aria-hidden="true"></span></button></th>
                    <th scope="col" class="action-column"><span class="sr-only">操作</span></th>
                  </tr>
                </thead>
                <tbody id="caseTableBody"></tbody>
              </table>
            </div>

            <div id="emptyState" class="empty-state" hidden>
              <strong>找不到符合條件的案件</strong>
              <span>請調整資料來源、風險或搜尋條件。</span>
            </div>

            <div class="table-footer">
              <label class="page-size">
                <span>每頁顯示行數</span>
                <select id="pageSize">
                  <option value="10">10</option>
                  <option value="25">25</option>
                  <option value="50">50</option>
                </select>
              </label>
              <span id="resultCount">0-0 之 0</span>
              <div class="pagination" aria-label="分頁">
                <button id="prevPage" type="button" aria-label="上一頁">‹</button>
                <button id="nextPage" type="button" aria-label="下一頁">›</button>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <aside id="caseDrawer" class="drawer" aria-labelledby="drawerTitle" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <span class="eyebrow">偽冒案件詳情</span>
        <h2 id="drawerTitle">—</h2>
      </div>
      <button id="closeDrawer" class="icon-button" type="button" aria-label="關閉案件詳情">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4 6.4 5Z"/></svg>
      </button>
    </div>

    <div id="drawerContent" class="drawer-content"></div>

    <div class="drawer-footer">
      <label class="outlined-field outlined-field--select drawer-status-field">
        <span class="outlined-label">處理狀態</span>
        <select id="statusSelect">
          <option value="scheduled">已排程（待內部處理）</option>
          <option value="not_submitted">不送件（證據／資料不足）</option>
          <option value="false_positive">誤判（非偽冒）</option>
          <option value="submitted">已送件（已人工送出 Meta 檢舉）</option>
          <option value="accepted">已受理（Meta 已受理或回覆）</option>
          <option value="takedown_confirmed">因其他因素被下架</option>
          <option value="success">已下架成功</option>
          <option value="failed">下架失敗（Meta 拒絕或無法處理）</option>
        </select>
      </label>
    </div>
  </aside>

  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="closeModal" class="icon-button modal-close" type="button" aria-label="關閉確認視窗">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4 6.4 5Z"/></svg>
      </button>
      <h2 id="modalTitle">變更處理狀態</h2>
      <p id="modalHint">狀態變更只寫入 Internal Console，<strong>不會自動觸發任何對外送件動作</strong>。</p>
      <div id="modalSummary" class="modal-summary"></div>
      <div class="modal-actions">
        <button id="cancelSchedule" class="button button--ghost" type="button">取消</button>
        <button id="confirmStatus" class="button button--primary" type="button">確認變更</button>
      </div>
    </section>
  </div>

  <div id="shotBackdrop" class="shot-backdrop" hidden>
    <figure class="shot-modal" role="dialog" aria-modal="true" aria-labelledby="shotTitle">
      <div class="shot-modal-header">
        <div>
          <span class="eyebrow" id="shotKind">截圖</span>
          <h2 id="shotTitle">—</h2>
          <span class="shot-meta" id="shotMeta"></span>
        </div>
        <button id="closeShot" class="icon-button" type="button" aria-label="關閉截圖">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4 6.4 5Z"/></svg>
        </button>
      </div>
      <div class="shot-canvas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5H3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1Zm-1 12H4V7h16v10ZM8.5 10.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM6 15.5l3.2-3.2 2.1 2.1 3.4-3.4L18 14.4v1.1H6v-.5Z"/></svg>
        <span>此欄位將顯示爬取當下的截圖</span>
      </div>
      <figcaption class="shot-footnote" id="shotFootnote"></figcaption>
    </figure>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-hidden="true"></div>

  <script src="mock-data.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
